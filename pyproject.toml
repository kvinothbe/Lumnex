[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizuara"
version = "0.0.1"
description = "Auto-reply LLM agent for LumenX with confidence-gated auto-send"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vinoth Kumar K" }]

dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "truststore>=0.9",  # use the OS cert store so corporate SSL inspection works
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # FastAPI Form(...) handling on the queue page
    "torch>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vizuara"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
